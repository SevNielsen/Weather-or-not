<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <title>Welcome</title>
    <style>
        body {
            background: linear-gradient(135deg, #e0f7fa, #81d4fa);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            font-family: 'Arial', sans-serif;
        }

        .welcome-container {
            max-width: 1000px;
            width: 100%;
            background: #ffffff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            overflow: hidden;
            padding: 30px;
        }

        .section-title {
            color: #0288d1;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .section {
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #f9f9f9;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .row {
            margin-top: 15px;
        }

        .btn {
            border-radius: 30px;
        }
    </style>
</head>
<body>
    <div class="welcome-container">
        <div class="row">
            <!-- Left Section: Login -->
            <div class="col-md-6">
                <h3 class="section-title">Login</h3>
                <div class="section">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Login</button>
                        <a href="#" class="d-block text-center mt-2">Forgot password?</a>
                    </form>
                    <div class="mt-3">
                        <button class="btn btn-outline-dark w-100 mb-2">
                            <i class="fab fa-google"></i> Sign in with Google
                        </button>
                        <button class="btn btn-outline-secondary w-100">
                            <i class="fab fa-apple"></i> Sign in with Apple
                        </button>
                    </div>
                </div>
            </div>

            <!-- Right Section: Weather -->
            <div class="col-md-6">
                <h3 class="section-title">Current Weather</h3>
                <div class="section text-center">
                    <p id="weather-placeholder">Fetching weather data...</p>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Bottom Left: Phase of the Moon -->
            <div class="col-md-6">
                <h3 class="section-title">Phase of the Moon</h3>
                <div class="section text-center">
                    <p id="moon-phase-placeholder">Moon phase data will be displayed here.</p>
                </div>
            </div>

            <!-- Bottom Right: Tides -->
            <div class="col-md-6">
                <h3 class="section-title">Current Tide Information</h3>
                <div class="section text-center">
                    <p id="tide-placeholder">Tide chart will be displayed here.</p>
                </div>
            </div>
        </div>

        <p class="text-center mt-4">Don't have an account? <a href="/signup" class="btn btn-secondary">Signup</a></p>
    </div>

    <script>
        // Placeholder for weather data fetching
        document.getElementById('weather-placeholder').innerText = 'Sunny, 12°C';
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
