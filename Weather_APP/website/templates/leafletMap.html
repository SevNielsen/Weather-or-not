{% extends "navbar.html" %}
{% block title %}Weather Map{% endblock %}

{% block content %}
<style>
    /* Map Container */
    #map-container {
        position: relative;
        height: calc(100vh - 56px);
        /* Full height minus navbar */
        width: 100%;
        overflow: hidden;
    }

    #map {
        height: 100%;
        width: 100%;
    }

    /* Floating Controls */
    .floating-controls {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 1000;
    }

    .bottom-left-controls {
        position: absolute;
        bottom: 30px;
        left: 20px;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        gap: 5px;
    }

    /* Search Bar */
    .map-search {
        background: rgba(255, 255, 255, 0.9);
        border-radius: 30px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        padding: 5px;
        display: flex;
    }

    .map-search input {
        border: none;
        background: transparent;
        padding: 5px 15px;
        outline: none;
        width: 200px;
    }

    .map-search button {
        border-radius: 20px;
        padding: 5px 15px;
    }

    /* Control Buttons */
    .btn-control {
        background: rgba(255, 255, 255, 0.9);
        border: none;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        text-align: left;
        padding: 8px 15px;
        border-radius: 8px;
        font-weight: 500;
        transition: all 0.2s;
    }

    .btn-control:hover {
        transform: translateX(5px);
        background: white;
    }

    .btn-control.active {
        background: #007bff;
        color: white;
    }
</style>

<div id="map-container">
    <div id="map"></div>

    <!-- Top Right Search -->
    <div class="floating-controls">
        <div class="map-search">
            <input type="text" id="searchInput" placeholder="Search location...">
            <button class="btn btn-primary btn-sm" id="searchBtn"><i class="fas fa-search"></i></button>
        </div>
    </div>

    <!-- Bottom Left Controls -->
    <div class="bottom-left-controls">
        <button class="btn-control" id="temp"><i class="fas fa-thermometer-half mr-2"></i> Temperature</button>
        <button class="btn-control" id="precip"><i class="fas fa-cloud-rain mr-2"></i> Precipitation</button>
        <button class="btn-control" id="clouds"><i class="fas fa-cloud mr-2"></i> Clouds</button>
        <button class="btn-control" id="wind"><i class="fas fa-wind mr-2"></i> Wind</button>
        <button class="btn-control" id="pressure"><i class="fas fa-tachometer-alt mr-2"></i> Pressure</button>
        <button class="btn-control text-danger mt-2" id="clearLayers"><i class="fas fa-times mr-2"></i> Clear
            Layers</button>
    </div>
</div>

<!-- Leaflet CSS & JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css">
<link rel="stylesheet" href="{{ url_for('static', filename='leaflet-openweathermap.css') }}">
<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
<script src="{{ url_for('static', filename='leaflet-openweathermap.js') }}"></script>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Initialize Map
        var lat = parseFloat("{{ lat }}") || 49.886;
        var lon = parseFloat("{{ lon }}") || -119.496;
        var map = L.map('map').setView([lat, lon], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        var apiKey;
        var layers = {};
        var currentLayer = null;

        // Fetch Config
        fetch('/config').then(r => r.json()).then(config => {
            apiKey = config.apiKey;
            layers = {
                temp: L.OWM.temperature({ appId: apiKey, showLegend: true }),
                clouds: L.OWM.clouds({ appId: apiKey, showLegend: true }),
                precip: L.OWM.precipitation({ appId: apiKey, showLegend: true }),
                pressure: L.OWM.pressure({ appId: apiKey, showLegend: true }),
                wind: L.OWM.wind({ appId: apiKey, showLegend: true })
            };
        });

        // Layer Switching
        function switchLayer(layerId) {
            // Remove all layers
            Object.values(layers).forEach(l => map.removeLayer(l));
            document.querySelectorAll('.btn-control').forEach(b => b.classList.remove('active'));

            // Add selected layer
            if (layers[layerId]) {
                map.addLayer(layers[layerId]);
                document.getElementById(layerId).classList.add('active');
            }
        }

        document.querySelectorAll('.btn-control').forEach(btn => {
            if (btn.id !== 'clearLayers') {
                btn.addEventListener('click', () => switchLayer(btn.id));
            }
        });

        document.getElementById('clearLayers').addEventListener('click', function () {
            Object.values(layers).forEach(l => map.removeLayer(l));
            document.querySelectorAll('.btn-control').forEach(b => b.classList.remove('active'));
        });

        // Search
        function performSearch() {
            var city = document.getElementById('searchInput').value.trim();
            if (city && apiKey) {
                fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}`)
                    .then(r => r.json())
                    .then(data => {
                        if (data.coord) {
                            map.setView([data.coord.lat, data.coord.lon], 10);
                        } else {
                            alert('City not found');
                        }
                    });
            }
        }

        document.getElementById('searchBtn').addEventListener('click', performSearch);
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') performSearch();
        });
    });
</script>
{% endblock %}
