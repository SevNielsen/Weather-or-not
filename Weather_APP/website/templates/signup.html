<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <title>Signup</title>
    <style>
        body {
            background: linear-gradient(135deg, #b3e5fc, #81d4fa);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            font-family: 'Arial', sans-serif;
        }

        .signup-container {
            max-width: 900px;
            width: 100%;
            background: #ffffff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .signup-form-container {
            max-height: 60vh;
            overflow-y: auto;
            padding: 30px;
        }

        .section-title {
            color: #0288d1;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.8rem;
        }

        .form-outline {
            margin-bottom: 20px;
        }

        .form-control {
            height: 50px;
            font-size: 1rem;
            padding: 10px 15px;
        }

        .btn {
            border-radius: 30px;
            padding: 12px 20px;
            font-size: 1rem;
        }

        .btn-show-password {
            margin-top: 5px;
            display: block;
            text-align: right;
            font-size: 0.9rem;
            cursor: pointer;
            color: #0288d1;
        }

        .decorative-header {
            text-align: center;
            padding: 20px;
            background: #0288d1;
            color: white;
        }

        .decorative-header i {
            font-size: 2.5rem;
            margin-right: 10px;
        }

        .decorative-header span {
            font-size: 1.8rem;
            font-weight: bold;
        }

        .weather-themed-footer {
            padding: 15px;
            text-align: center;
            font-size: 0.9rem;
            color: #0288d1;
            background: #f1f1f1;
        }

        .weather-themed-footer i {
            margin-right: 5px;
        }

        .auth-buttons {
            padding: 15px;
            text-align: center;
            background: #f1f1f1;
        }

        .auth-buttons .btn {
            margin-bottom: 10px;
            width: 80%;
        }

        .auth-buttons a {
            display: block;
            margin-top: 10px;
            color: #0288d1;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
    </style>
    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById("form3Example5cg");
            passwordInput.type = passwordInput.type === "password" ? "text" : "password";
        }
    </script>
</head>
<body>
    <div class="signup-container">
        <div class="decorative-header">
            <i class="fas fa-cloud-sun"></i>
            <span>Weather or Not Signup</span>
        </div>

        <div class="signup-form-container">
            <h2 class="section-title">Create an Account</h2>
            <form method="POST" action="welcome.html">
                <div class="form-outline">
                    <label class="form-label" for="form3Example1cg">First Name</label>
                    <input type="text" id="form3Example1cg" class="form-control" name="First_Name" required>
                </div>

                <div class="form-outline">
                    <label class="form-label" for="form3Example2cg">Last Name</label>
                    <input type="text" id="form3Example2cg" class="form-control" name="Last_Name" required>
                </div>

                <div class="form-outline">
                    <label class="form-label" for="form3Example3cg">Email Address</label>
                    <input type="email" id="form3Example3cg" class="form-control" name="email" required>
                </div>

                <div class="form-outline">
                    <label class="form-label" for="form3Example6cg">Phone Number</label>
                    <input type="text" id="form3Example6cg" class="form-control" name="phone_number">
                </div>

                <div class="form-outline">
                    <label class="form-label" for="form3Example4cg">Preferred City</label>
                    <input type="text" id="form3Example4cg" class="form-control" name="city">
                </div>

                <div class="form-outline">
                    <label class="form-label" for="form3Example8cg">Home Address</label>
                    <input type="text" id="form3Example8cg" class="form-control" name="home_address" required>
                </div>

                <div class="form-outline">
                    <label class="form-label" for="form3Example9cg">Postal Code</label>
                    <input type="text" id="form3Example9cg" class="form-control" name="postal_code" required>
                </div>

                <div class="form-outline">
                    <label class="form-label" for="form3Example7cg">Username</label>
                    <input type="text" id="form3Example7cg" class="form-control" name="username" required>
                </div>

                <div class="form-outline">
                    <label class="form-label" for="form3Example5cg">Password</label>
                    <input type="password" id="form3Example5cg" class="form-control" name="password" required>
                    <span class="btn-show-password" onclick="togglePasswordVisibility()">Show Password</span>
                </div>

                <div class="d-flex justify-content-center">
                    <button type="submit" class="btn btn-primary">Register</button>
                </div>
            </form>
        </div>

        <div class="auth-buttons">
            <button type="button" class="btn btn-outline-dark">
                <i class="fab fa-google"></i> Sign up with Google
            </button>
            <button type="button" class="btn btn-outline-secondary">
                <i class="fab fa-apple"></i> Sign up with Apple
            </button>
            <a href="{{ url_for('auth.home') }}"><u>Already have an account? Go to Welcome Page</u></a>
        </div>

        <div class="weather-themed-footer">
            <p><i class="fas fa-cloud"></i> Get ready to explore weather insights and more!</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
